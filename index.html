<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a9d4f2" id="metaTheme">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext x=%2750%27 y=%2780%27 font-size=%2780%27 text-anchor=%27middle%27%3E❄️%3C/text%3E%3C/svg%3E">
<title>В школу или нет?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://api.open-meteo.com" crossorigin>
<!-- шрифты грузятся без блокировки отрисовки -->
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Nunito:wght@500;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Nunito:wght@500;800&display=swap" rel="stylesheet"></noscript>
<style>
:root{
  color-scheme:light;
  --font-head:'Unbounded','Arial Black',sans-serif;
  --font-body:'Nunito','Segoe UI',Arial,sans-serif;
  --sky1:#a9d4f2; --sky2:#f6e6dc; --ink:#14304a; --glass:rgba(255,255,255,.55); --edge:rgba(255,255,255,.8); --solid:rgba(255,255,255,.8);
  --trees:#2f6b73; --ground:#ffffff;
  --dlg-bg:#f6fbff; --dlg-ink:#14304a; --field-bg:#ffffff; --field-edge:#9fc2dd; --btn-bg:#14304a; --btn-ink:#ffffff; --btn-alt:#dcebf6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --sky1:#081832; --sky2:#27508a; --ink:#eaf5ff; --glass:rgba(255,255,255,.12); --edge:rgba(255,255,255,.25); --solid:rgba(16,38,68,.85);
    --trees:#0c2747; --ground:#cfe4f6;
    --dlg-bg:#12243d; --dlg-ink:#eaf5ff; --field-bg:#0b1a2e; --field-edge:#3d6a98; --btn-bg:#8fd3ff; --btn-ink:#08203a; --btn-alt:#223c5c;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --sky1:#081832; --sky2:#27508a; --ink:#eaf5ff; --glass:rgba(255,255,255,.12); --edge:rgba(255,255,255,.25); --solid:rgba(16,38,68,.85);
  --trees:#0c2747; --ground:#cfe4f6;
  --dlg-bg:#12243d; --dlg-ink:#eaf5ff; --field-bg:#0b1a2e; --field-edge:#3d6a98; --btn-bg:#8fd3ff; --btn-ink:#08203a; --btn-alt:#223c5c;
}
body{--accent:#8a9aa8}
body[data-state="go"]{--accent:#2fa36b}
body[data-state="stay"]{--accent:#4aa8ee}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--font-body);font-size:18px;color:var(--ink);
  background:linear-gradient(180deg,var(--sky1),var(--sky2));background-attachment:fixed;
  min-height:100%;overflow-x:hidden;overflow-y:auto;position:relative;transition:background .4s,color .4s;-webkit-text-size-adjust:100%}
@supports (height:100dvh){main{min-height:100dvh}}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
#scene{position:fixed;left:0;right:0;bottom:0;width:100%;height:clamp(150px,28vh,300px);z-index:1;pointer-events:none}
#scene .tree{fill:var(--trees)}
#scene .drift{fill:var(--ground)}
.orb{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8vh);right:12vw;border-radius:50%;z-index:0;opacity:0;transition:opacity .4s;pointer-events:none}
.sun{width:90px;height:90px;background:#fff3c4;box-shadow:0 0 60px 20px rgba(255,236,170,.7)}
.moon{width:68px;height:68px;background:#f2f8ff;box-shadow:0 0 40px 10px rgba(180,220,255,.35)}
:root:not([data-theme="dark"]) .sun{opacity:1}
:root[data-theme="dark"] .moon{opacity:1}
main{
  position:relative;z-index:2;min-height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  padding:calc(env(safe-area-inset-top,0px) + 24px) max(20px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom,0px) + 20vh) max(20px,env(safe-area-inset-left));
}
.place{font-weight:800;margin:0 0 4px;opacity:.85;overflow-wrap:anywhere}
.temp{font-family:var(--font-head);font-weight:800;font-size:clamp(76px,min(26vw,24vh),160px);line-height:1;margin:0;letter-spacing:-.03em}
.feels{margin:6px 0 24px;font-weight:500;font-size:1.1em;opacity:.9;min-height:1.4em}
.card{
  background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1.5px solid var(--edge);border-top:5px solid var(--accent);border-radius:28px;padding:22px 26px;max-width:460px;width:100%;
  transition:border-color .4s;
}
.verdict{font-family:var(--font-head);font-weight:800;font-size:clamp(26px,8vw,44px);line-height:1.12;margin:0 0 10px;overflow-wrap:anywhere}
.why{margin:0;font-weight:500}
.retry{margin-top:14px}
.retry[hidden]{display:none}
.icon-btn{
  position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:5;
  width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--ink);font-size:21px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
#gear{left:10px;left:max(10px,env(safe-area-inset-left));opacity:.55}
#theme{right:10px;right:max(10px,env(safe-area-inset-right));opacity:.7}
.icon-btn:hover,.icon-btn:focus-visible{opacity:1}
dialog{
  border:0;border-radius:24px;padding:24px;max-width:420px;width:calc(100% - 32px);
  max-height:calc(100% - 32px);overflow:auto;
  background:var(--dlg-bg);color:var(--dlg-ink);font-family:var(--font-body);
}
dialog::backdrop{background:rgba(8,20,40,.6)}
h2{font-family:var(--font-head);font-size:20px;margin:0 0 14px}
label{display:block;font-weight:800;margin:14px 0 6px;font-size:16px}
input[type=text],input[type=number],input[type=password]{
  font:inherit;width:100%;padding:10px 12px;border:2px solid var(--field-edge);border-radius:12px;background:var(--field-bg);color:var(--dlg-ink)}
.row{display:flex;gap:8px}
button.btn{font:inherit;font-weight:800;padding:11px 16px;border:0;border-radius:12px;background:var(--btn-bg);color:var(--btn-ink);cursor:pointer}
button.btn.alt{background:var(--btn-alt);color:var(--dlg-ink)}
.check{display:flex;align-items:center;gap:10px;margin-top:14px}
.check input{width:22px;height:22px;flex:none}
.msg{min-height:1.3em;font-size:15px;margin:10px 0 0;color:#e0702e}
.actions{display:flex;gap:8px;margin-top:18px;justify-content:flex-end}
.results{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.results button{font:inherit;font-weight:500;text-align:left;padding:10px 12px;border:2px solid var(--field-edge);border-radius:12px;background:var(--field-bg);color:var(--dlg-ink);cursor:pointer}
.results button.on{border-color:#2fa36b;font-weight:800}
.hint{font-size:14px;opacity:.7;margin:6px 0 0;font-weight:500}
@media (min-width:900px){
  .card{max-width:560px;padding:28px 36px}
  .why{font-size:1.1em}
}
@media (min-width:1600px){
  body{font-size:20px}
  .card{max-width:640px}
}
@media (max-height:520px){
  main{padding-top:14px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14vh)}
  .temp{font-size:clamp(48px,20vh,96px)}
  .feels{margin-bottom:12px}
  .card{padding:12px 18px}
  .verdict{font-size:clamp(20px,6vh,32px)}
  .orb{display:none}
  #scene{height:24vh;min-height:90px}
}
@media (max-width:340px){ .temp{font-size:68px} .card{padding:16px} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
.lite *{transition:none!important}
.lite .card{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--solid)}
.lite .orb{box-shadow:none}
:focus-visible{outline:3px solid #e0702e;outline-offset:2px}
</style>
</head>
<body data-state="wait">
<div class="orb sun"></div><div class="orb moon"></div>
<canvas id="snow" aria-hidden="true"></canvas>
<noscript><p style="position:relative;z-index:9;text-align:center;padding:20px">Для работы сайта нужен JavaScript.</p></noscript>
<svg id="scene" viewBox="0 0 1200 240" preserveAspectRatio="xMidYMax meet" aria-hidden="true"></svg>

<button class="icon-btn" id="gear" aria-label="Настройки">⚙</button>
<button class="icon-btn" id="theme" aria-label="Сменить тему">☾</button>

<main>
  <p class="place" id="place">Загружаем погоду…</p>
  <p class="temp" id="temp">–</p>
  <p class="feels" id="feels">&nbsp;</p>
  <div class="card">
    <h1 class="verdict" id="verdict">Смотрим на термометр</h1>
    <p class="why" id="why" aria-live="polite"></p>
    <button class="btn retry" id="retry" type="button" hidden>Повторить</button>
  </div>
</main>

<dialog id="setDlg">
  <h2>Настройки</h2>
  <label for="limit">Не идём в школу, если холоднее (°C)</label>
  <input type="number" id="limit" step="1">
  <div class="check">
    <input type="checkbox" id="useFeels"><label for="useFeels" style="margin:0;font-weight:500">Учитывать «ощущается как»</label>
  </div>
  <label for="village">Город или село</label>
  <div class="row"><input type="text" id="village" placeholder="Например, Чесноковка" autocomplete="off"><button class="btn" id="find" type="button">Найти</button></div>
  <div id="results" class="results"></div>
  <p class="hint" id="found"></p>
  <p class="msg" id="setMsg"></p>
  <div class="actions">
    <button class="btn alt" id="setCancel" type="button">Отмена</button>
    <button class="btn" id="setSave" type="button">Сохранить</button>
  </div>
</dialog>

<script>
(function(){
  /* ====== ЗНАЧЕНИЯ ПО УМОЛЧАНИЮ ====== */
  var CONFIG = {
    name: 'Чесноковка, Уфа',
    lat: 54.60,
    lon: 55.93,
    limit: -25,      // при такой температуре и ниже остаёмся дома
    useFeels: true   // true: решение принимается по «ощущается как»
  };
  /* =================================== */

  var $ = function(id){ return document.getElementById(id); };
  var root = document.documentElement;

  /* Слабое устройство: экономим ресурсы (без размытия, анимаций, меньше снега) */
  var lite = !!((navigator.connection && navigator.connection.saveData) ||
    (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 2) ||
    (navigator.deviceMemory && navigator.deviceMemory <= 2));
  if (lite) root.classList.add('lite');

  /* ---------- Настройки (с проверкой данных из localStorage) ---------- */
  var S = JSON.parse(JSON.stringify(CONFIG));
  try {
    var saved = JSON.parse(localStorage.getItem('sw-v3') || '{}') || {};
    if (typeof saved.name === 'string') S.name = saved.name;
    if (typeof saved.lat === 'number' && isFinite(saved.lat)) S.lat = saved.lat;
    if (typeof saved.lon === 'number' && isFinite(saved.lon)) S.lon = saved.lon;
    if (typeof saved.limit === 'number' && isFinite(saved.limit)) S.limit = saved.limit;
    if (typeof saved.useFeels === 'boolean') S.useFeels = saved.useFeels;
  } catch(e){}
  function persist(){ try { localStorage.setItem('sw-v3', JSON.stringify(S)); } catch(e){} }

  /* ---------- Тема ---------- */
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  var chosen = null;
  try { chosen = localStorage.getItem('sw-theme'); } catch(e){}
  if (chosen !== 'dark' && chosen !== 'light') chosen = null;
  function applyTheme(){
    var t = chosen || (mq.matches ? 'dark' : 'light');
    root.dataset.theme = t;
    $('theme').textContent = t === 'dark' ? '☀' : '☾';
    $('metaTheme').setAttribute('content', t === 'dark' ? '#081832' : '#a9d4f2');
  }
  $('theme').onclick = function(){
    chosen = root.dataset.theme === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('sw-theme', chosen); } catch(e){}
    applyTheme();
  };
  if (mq.addEventListener) mq.addEventListener('change', applyTheme);
  applyTheme();

  /* ---------- Вердикт ---------- */
  var W = { t:null, f:null };
  function render(){
    var b = document.body;
    $('place').textContent = S.name || 'Местоположение';
    if (S.lat === null || S.lon === null){
      b.dataset.state = 'wait';
      $('temp').textContent = '–'; $('feels').innerHTML = '&nbsp;';
      $('verdict').textContent = 'Место не задано';
      $('why').textContent = 'Найдите свой город в настройках (значок ⚙).';
      return;
    }
    if (W.t === null){
      b.dataset.state = 'wait';
      $('temp').textContent = '–'; $('feels').innerHTML = '&nbsp;';
      $('verdict').textContent = 'Смотрим на термометр';
      $('why').textContent = ''; $('retry').hidden = true;
      return;
    }
    var lim = Number(S.limit); if (!isFinite(lim)) lim = CONFIG.limit;
    var hasF = (W.f !== null);
    var cur = (S.useFeels && hasF) ? W.f : W.t;   // по чему принимаем решение
    var stay = cur <= lim;
    var dReal = Math.round(Math.round(W.t) - lim); // разница считается по НАСТОЯЩЕЙ температуре
    b.dataset.state = stay ? 'stay' : 'go';
    $('temp').textContent = Math.round(W.t) + '°';
    if (hasF) $('feels').textContent = 'Ощущается как ' + Math.round(W.f) + '°'; else $('feels').innerHTML = '&nbsp;';
    $('verdict').textContent = stay ? 'Сегодня сидим дома!' : 'Сегодня идём в школу';
    var txt;
    if (stay){
      if (dReal < 0) txt = 'Холоднее порога (' + lim + '°) на ' + Math.abs(dReal) + '°.';
      else if (dReal === 0) txt = 'Температура на пороге (' + lim + '°).';
      else txt = 'По ощущениям холоднее порога (' + lim + '°).';
    } else {
      if (dReal <= 0) txt = 'По ощущениям теплее порога (' + lim + '°).';
      else if (dReal <= 5) txt = 'До порога (' + lim + '°) всего ' + dReal + '°. Одевайся потеплее!';
      else txt = 'Порог — ' + lim + '°, до него ещё ' + dReal + '°. Хорошего дня!';
    }
    $('why').textContent = txt;
  }

  var lastLoad = 0, reqId = 0, retryTimer = 0;
  function readCache(){
    try {
      var c = JSON.parse(localStorage.getItem('sw-cache') || 'null');
      if (c && c.lat === S.lat && c.lon === S.lon && Date.now() - c.ts < 3 * 3600 * 1000) return c;
    } catch(e){}
    return null;
  }
  function showError(reason){
    var offline = (navigator.onLine === false);
    $('why').textContent = offline
      ? 'Нет подключения к интернету.'
      : 'Не удалось загрузить погоду (' + reason + ').';
    $('retry').hidden = false;
  }
  function load(attempt){
    attempt = attempt || 0;
    clearTimeout(retryTimer);
    if (S.lat === null || S.lon === null){ render(); return; }
    if (W.t === null){ var c = readCache(); if (c){ W.t = c.t; W.f = c.f; render(); } }
    var id = ++reqId;
    var ctl = window.AbortController ? new AbortController() : null;
    var timedOut = false;
    var timer = setTimeout(function(){ timedOut = true; if (ctl) ctl.abort(); }, 12000);
    fetch('https://api.open-meteo.com/v1/forecast?latitude=' + S.lat + '&longitude=' + S.lon +
      '&current=temperature_2m,apparent_temperature&timezone=auto', ctl ? { signal: ctl.signal } : {})
      .then(function(r){ if (!r.ok) throw new Error('сервер ответил ' + r.status); return r.json(); })
      .then(function(d){
        clearTimeout(timer);
        if (id !== reqId) return; // пришёл устаревший ответ (место уже сменили)
        if (!d || !d.current || typeof d.current.temperature_2m !== 'number') throw new Error('некорректный ответ');
        W.t = d.current.temperature_2m;
        W.f = (typeof d.current.apparent_temperature === 'number') ? d.current.apparent_temperature : null;
        lastLoad = Date.now();
        $('retry').hidden = true;
        try { localStorage.setItem('sw-cache', JSON.stringify({ lat:S.lat, lon:S.lon, t:W.t, f:W.f, ts:lastLoad })); } catch(e){}
        render();
      })
      .catch(function(err){
        clearTimeout(timer);
        if (id !== reqId) return;
        // автоматически пробуем ещё раз: через 2 и 6 секунд
        if (attempt < 2){ retryTimer = setTimeout(function(){ load(attempt + 1); }, attempt === 0 ? 2000 : 6000); }
        if (W.t === null){
          var reason = timedOut ? 'долгий ответ' : (err && err.message === 'Failed to fetch' ? 'запрос заблокирован или нет связи' : (err && err.message) || 'ошибка');
          showError(reason);
        }
      });
  }
  $('retry').onclick = function(){ $('retry').hidden = true; $('why').textContent = ''; load(0); };

  /* ---------- Настройки + кнопка «Назад» ---------- */
  var dlg = $('setDlg'), picked = null;

  // если страницу перезагрузили с «хвостом» от диалога — убираем его
  try { if (history.state && history.state.dlg) history.replaceState(null, ''); } catch(e){}

  $('gear').onclick = function(){
    $('limit').value = S.limit; $('useFeels').checked = !!S.useFeels;
    $('village').value = ''; $('results').innerHTML = ''; $('setMsg').textContent = '';
    $('found').textContent = S.name ? 'Сейчас: ' + S.name : '';
    picked = null;
    dlg.showModal();
    // добавляем запись в историю, чтобы «Назад» закрывал настройки, а не сайт
    try { history.pushState({ dlg: 1 }, ''); } catch(e){}
  };
  // любое закрытие (Отмена, Сохранить, Esc, фон) убирает эту запись
  dlg.addEventListener('close', function(){
    if (history.state && history.state.dlg){ try { history.back(); } catch(e){} }
  });
  // «Назад» (кнопка телефона / жест / браузер) закрывает настройки
  window.addEventListener('popstate', function(){ if (dlg.open) dlg.close(); });
  // клик по тёмному фону закрывает диалог
  dlg.addEventListener('click', function(e){
    if (e.target !== dlg) return;
    var r = dlg.getBoundingClientRect();
    if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) dlg.close();
  });
  $('setCancel').onclick = function(){ dlg.close(); };

  var searchId = 0;
  function search(){
    var q = $('village').value.trim(); if (!q) return;
    var id = ++searchId;
    picked = null;
    $('found').textContent = 'Ищем…'; $('results').innerHTML = ''; $('setMsg').textContent = '';
    fetch('https://geocoding-api.open-meteo.com/v1/search?count=5&language=ru&name=' + encodeURIComponent(q))
      .then(function(r){ if (!r.ok) throw new Error('http'); return r.json(); })
      .then(function(d){
        if (id !== searchId) return;
        if (!d.results || !d.results.length){ $('found').textContent = 'Ничего не нашлось. Проверьте название.'; return; }
        $('found').textContent = 'Выберите нужное место:';
        d.results.forEach(function(c){
          var label = c.name + (c.admin1 ? ', ' + c.admin1 : '') + (c.country ? ', ' + c.country : '');
          var btn = document.createElement('button');
          btn.type = 'button'; btn.textContent = label;
          btn.onclick = function(){
            picked = { name: c.name + (c.admin1 ? ', ' + c.admin1 : ''), lat: c.latitude, lon: c.longitude };
            Array.prototype.forEach.call($('results').children, function(x){ x.classList.remove('on'); });
            btn.classList.add('on');
            $('setMsg').textContent = '';
          };
          $('results').appendChild(btn);
        });
      }).catch(function(){ if (id === searchId) $('found').textContent = 'Ошибка поиска. Проверьте интернет.'; });
  }
  $('find').onclick = search;
  $('village').onkeydown = function(e){ if (e.key === 'Enter'){ e.preventDefault(); search(); } };

  $('setSave').onclick = function(){
    var lim = parseFloat($('limit').value);
    if (isNaN(lim)){ $('setMsg').textContent = 'Укажите градус'; return; }
    if ($('village').value.trim() && !picked){ $('setMsg').textContent = 'Нажмите «Найти» и выберите место из списка (или очистите поле)'; return; }
    S.limit = lim; S.useFeels = $('useFeels').checked;
    var moved = false;
    if (picked){ S.name = picked.name; S.lat = picked.lat; S.lon = picked.lon; moved = true; }
    persist(); dlg.close();
    if (moved){ W.t = null; W.f = null; render(); load(); } else { render(); }
  };

  /* ---------- Пейзаж (подстраивается под размер экрана) ---------- */
  var scene = $('scene'), sceneKey = '';
  function buildScene(){
    var H = scene.clientHeight || 150, Wpx = scene.clientWidth || innerWidth || 360;
    var vw = Math.round(Wpx / H * 240);              // ширина в тех же единицах, что и высота 240
    var key = vw + 'x' + Math.round(H);
    if (key === sceneKey) return; sceneKey = key;
    scene.setAttribute('viewBox', '0 0 ' + vw + ' 240');
    var r = function(n){ return Math.round(n * 10) / 10; };
    var h = '<path class="drift" d="M0 240V205Q' + r(vw*.125) + ' 175 ' + r(vw*.275) + ' 200T' + r(vw*.58) + ' 195T' + r(vw*.875) + ' 190T' + vw + ' 200V240Z"/>';
    var x = -20, i = 0;
    while (x < vw + 30){
      var s = 0.7 + ((i * 37) % 10) / 14, base = 205 - ((i * 13) % 3) * 8;
      for (var j = 0; j < 3; j++){
        var w = (60 - j * 14) * s, top = base - (j + 1) * 38 * s, bot = base - j * 30 * s;
        h += '<polygon class="tree" points="' + r(x - w/2) + ',' + r(bot) + ' ' + r(x + w/2) + ',' + r(bot) + ' ' + r(x) + ',' + r(top) + '"/>';
      }
      h += '<rect class="tree" x="' + r(x - 3) + '" y="' + base + '" width="6" height="14"/>';
      x += 55 + ((i * 29) % 70); i++;
    }
    h += '<path class="drift" d="M0 240V222Q' + r(vw*.167) + ' 205 ' + r(vw*.35) + ' 218T' + r(vw*.667) + ' 214T' + vw + ' 220V240Z"/>';
    scene.innerHTML = h;
  }
  buildScene();

  /* ---------- Снег ---------- */
  (function(){
    var c = $('snow'), g = c.getContext('2d'), flakes = [], w = 0, h = 0, dpr = 1, raf = 0, last = 0, prev = 0, rt = 0;
    var mqm = window.matchMedia('(prefers-reduced-motion: reduce)');
    // при «уменьшении анимации» (в т.ч. отключённые анимации Windows) снег не замирает, а падает медленно и спокойно
    var calm = mqm.matches;
    if (mqm.addEventListener) mqm.addEventListener('change', function(){ calm = mqm.matches; });
    var step;
    function setStep(){ step = 1000 / (lite ? 24 : 40) - 3; }
    setStep();
    var frames = 0, slow = 0;

    function target(){ return Math.min(lite ? 40 : 120, Math.round(w * h / (lite ? 20000 : 11000))); }
    function make(){ return { x:Math.random()*w, y:Math.random()*h, r:1+Math.random()*2.5, v:.3+Math.random()*.9, p:Math.random()*6.28 }; }
    function size(){
      var nw = innerWidth, nh = innerHeight, nd = lite ? 1 : Math.min(window.devicePixelRatio || 1, 2);
      if (flakes.length && nw === w && nh === h && nd === dpr) return;
      var ow = w; w = nw; h = nh; dpr = nd;
      c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      var i;
      if (ow > 0) for (i = 0; i < flakes.length; i++){ flakes[i].x *= w / ow; if (flakes[i].y > h) flakes[i].y = Math.random() * h; }
      var n = target();
      while (flakes.length < n) flakes.push(make());
      if (flakes.length > n) flakes.length = n;
    }
    function frame(now, still){
      var dt = Math.min(3, (now - last) / 16.7); last = now;
      var sway = (lite || calm) ? 0 : 12, speed = calm ? .35 : 1;
      g.clearRect(0, 0, w, h);
      g.fillStyle = 'rgba(255,255,255,.92)';
      g.beginPath();
      for (var i = 0; i < flakes.length; i++){
        var f = flakes[i], x = f.x + (sway ? Math.sin(now / 1500 + f.p) * sway : 0);
        g.moveTo(x + f.r, f.y); g.arc(x, f.y, f.r, 0, 6.28);
        if (!still){ f.y += f.v * speed * dt; if (f.y > h + 5){ f.y = -5; f.x = Math.random() * w; } }
      }
      g.fill();
    }
    function goLite(){
      lite = true; root.classList.add('lite'); setStep();
      dpr = 0; size(); // пересоздаст холст с dpr=1 и уменьшит число снежинок
    }
    function loop(now){
      raf = requestAnimationFrame(loop);
      // авто-определение слабого устройства: если первые ~90 кадров идут медленно — включаем экономный режим
      if (!lite && frames < 90){
        var d = now - prev; prev = now; frames++;
        if (frames > 5 && d > 45 && d < 1000) slow++;
        if (frames === 90 && slow > 30) goLite();
      }
      if (now - last < step) return;
      frame(now, false);
    }
    function start(){ if (!raf){ prev = performance.now(); last = prev; raf = requestAnimationFrame(loop); } }
    function stop(){ cancelAnimationFrame(raf); raf = 0; }
    size(); frame(performance.now(), true); start();
    addEventListener('resize', function(){
      clearTimeout(rt);
      rt = setTimeout(function(){ size(); buildScene(); frame(performance.now(), true); }, 150);
    });
    document.addEventListener('visibilitychange', function(){ if (document.hidden) stop(); else start(); });
  })();

  render(); load();
  setInterval(function(){ if (!document.hidden) load(); }, 15 * 60 * 1000);
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden && Date.now() - lastLoad > 10 * 60 * 1000) load();
  });
  addEventListener('online', function(){ if (W.t === null || Date.now() - lastLoad > 5 * 60 * 1000) load(); });
})();
</script>
</body>
</html>
